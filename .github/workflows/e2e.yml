name: dep-dlm-bbmri E2E (ls-aai-dev)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        daemon_mode: [direct, daemons]
    name: ${{ matrix.daemon_mode }}
    env:
      DAEMON_MODE: ${{ matrix.daemon_mode }}
      OIDC_ISSUER: https://login.aai.lifescience-ri.eu/oidc/
      OIDC_TOKEN_URL: https://login.aai.lifescience-ri.eu/oidc/token
      OIDC_CLIENT_ID: ${{ secrets.LS_AAI_DEV_OIDC_CLIENT_ID }}
      OIDC_CLIENT_SECRET: ${{ secrets.LS_AAI_DEV_OIDC_CLIENT_SECRET }}
      OIDC_GRANT_TYPE: client_credentials
      OIDC_EXPECTED_SCOPE: "openid profile eduperson_entitlement offline_access"

    steps:
      - uses: actions/checkout@v4

      - name: Generate certs
        run: make certs

      - name: Render idpsecrets.json from secrets
        run: |
          cp configs/rucio/idpsecrets.json.example configs/rucio/idpsecrets.json
          sed -i \
            -e "s|<valid client id>|$OIDC_CLIENT_ID|g" \
            -e "s|<valid client secret>|$OIDC_CLIENT_SECRET|g" \
            configs/rucio/idpsecrets.json

      - name: Start the stack
        run: make start DAEMON_MODE=${{ matrix.daemon_mode }}

      - name: Init testbed (accounts, RSEs, OIDC seed)
        run: make init

      - name: Probe teapot
        run: make probe-teapot

      - name: Probe xrootd
        run: make probe-xrootd

      - name: Rucio E2E transfer tests
        run: make test-rucio-transfers

      - name: Rucio E2E deletion tests
        run: make test-rucio-deletion

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200

      - name: Teardown
        if: always()
        run: |
          make cleanup || true
          make clear-artifacts || true
